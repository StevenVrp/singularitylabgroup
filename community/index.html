<html lang="en">
<head>
<meta charset="UTF-8">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'singularity-gray': '#1a1a1a',
        'singularity-light-gray': '#f5f5f7',
        'singularity-blue': '#0066cc',

</script>

<style>
body { font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; }

  background: linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);

.nav-scrolled .nav-link { color: #1a1a1a; }
.prose img { border-radius: 1rem; margin: 1.5rem 0; }
</style>
</head>

<body class="bg-singularity-light-gray text-singularity-gray">

<!-- NAVBAR (same as yours, trimmed for brevity) -->
<nav id="navbar" class="fixed top-0 w-full z-50 py-4 bg-white shadow-sm">
  <div class="container mx-auto px-6 flex items-center justify-between">
    <a href="/" class="text-2xl font-bold">
      <img src="/Images/Logo2.png" class="h-10">
    </a>
    <div class="hidden md:flex space-x-8">
      <a href="/?redirect=/home/#partners" class="nav-link text-black">Partners</a>
      <a href="/lessons/" class="nav-link text-black">Lessons</a>
      <a href="/studyassistantpro/" class="nav-link text-black">Study Assistant <span class="pro-badge">Pro</span></a>
      <a href="/community/" class="nav-link text-black font-semibold">Community</a>
      <a href="/?redirect=/home/#about" class="nav-link text-black">About</a>
      <a href="/?redirect=/home/#members" class="nav-link text-black">Team</a>
      <a href="/?redirect=/home/#join" class="nav-link text-black">Join</a>
      <a href="/legal/" class="nav-link text-black">Legal</a>
    </div>
    <a href="/welcome/" class="nav-link text-black"><i class="fa fa-user"></i></a>
  </div>
</nav>

<!-- MAIN -->
<main class="pt-32 pb-20">
<div class="container mx-auto px-6 max-w-4xl">

  <!-- HEADER -->
  <div class="mb-12 text-center">
    <p class="uppercase tracking-[0.3em] text-sm text-gray-400 mb-4">Community</p>
    <h1 class="text-4xl md:text-5xl font-bold mb-4">Discussions & Articles</h1>
    <p class="text-gray-600 text-lg">Ask, answer, and explore physical science.</p>
  </div>

  <!-- NEW POST -->
  <div id="new-post" class="hidden mb-16 bg-white p-8 rounded-3xl shadow-sm">
    <h2 class="text-xl font-bold mb-6">New Post</h2>
    <div class="space-y-4">
      <input id="title" class="w-full px-5 py-3 rounded-xl border" placeholder="Title">
      <label class="flex items-center gap-2 text-sm">
        <input id="is-question" type="checkbox" class="rounded"> This is a question
      </label>
      <textarea id="content" rows="8" class="w-full px-5 py-3 rounded-xl border" placeholder="Markdown supported…"></textarea>
      <button id="submit" class="bg-singularity-blue text-white px-8 py-3 rounded-full hover:bg-blue-700 transition">
        Publish
      </button>
    </div>
  </div>

  <!-- FEED -->
  <div id="feed" class="space-y-8"></div>

</div>
</main>

<!-- FOOTER (same as yours) -->
<footer class="bg-black text-white py-12">
  <div class="container mx-auto px-6 text-center text-gray-400 text-sm">
    © 2026 Singularity Lab
  </div>
</footer>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  'https://wtfmsmibjktgajegflwp.supabase.co',
  'sb_publishable_ez5qG1v0pPIuvv7FF4x7ew_YuqM7dDJ'
);

const feed = document.getElementById('feed');
const form = document.getElementById('new-post');
const submit = document.getElementById('submit');

let session = null;

(async () => {
  ({ data: { session: s } }) = await supabase.auth.getSession();
  session = s;
  if (session) form.classList.remove('hidden');
  load();
})();

async function load() {
  const { data: posts } = await supabase
    .from('community_posts')
    .select(`*, community_replies(*), community_upvotes(user_id)`)
    .order('is_pinned', { ascending: false })
    .order('created_at', { ascending: false });

  feed.innerHTML = '';
  posts.forEach(renderPost);
}

function renderPost(post) {
  const el = document.createElement('article');
  el.className = 'bg-white p-8 rounded-3xl shadow-sm';
  const upvoted = post.community_upvotes.some(u => u.user_id === session?.user.id);
  const upvotes = post.community_upvotes.length;

  el.innerHTML = `
    <header class="mb-4">
      <div class="flex items-center gap-2 mb-1">
        ${post.is_pinned ? '<i class="fa fa-thumb-tack text-singularity-blue"></i>' : ''}
        ${post.is_question ? '<span class="text-xs font-bold uppercase text-blue-600">Question</span>' : ''}
        <h2 class="text-xl font-bold">${post.title}</h2>
      </div>
      <p class="text-sm text-gray-400 mb-2">${new Date(post.created_at).toLocaleDateString()} • ${post.author_name}</p>
      <div class="prose max-w-none">${marked.parse(post.content)}</div>
    </header>

    <div class="flex items-center gap-6 text-sm mb-6">
      <button class="upvote flex items-center gap-2 ${upvoted ? 'text-singularity-blue' : 'text-gray-400'}">
        <i class="fa fa-arrow-up"></i> ${upvotes}
      </button>
      <button class="reply-toggle text-gray-400 hover:text-singularity-blue">
        <i class="fa fa-comment"></i> Reply
      </button>
    </div>

    <div class="replies space-y-4 pl-6 border-l border-gray-100"></div>

    <div class="reply-box hidden mt-6">
      <textarea rows="3" class="reply-input w-full px-4 py-3 rounded-xl border" placeholder="Write a reply…"></textarea>
      <button class="submit-reply mt-3 bg-singularity-blue text-white px-6 py-2 rounded-full text-sm hover:bg-blue-700 transition">
        Post Reply
      </button>
    </div>
  `;

  // Upvote
  el.querySelector('.upvote').onclick = async () => {
    if (!session) return alert('Sign in to vote');
    if (upvoted) {
      await supabase.from('community_upvotes').delete().match({ post_id: post.id, user_id: session.user.id });
    } else {
      await supabase.from('community_upvotes').insert({ post_id: post.id, user_id: session.user.id });
    }
    load();
  };

  // Replies
  const replyBox = el.querySelector('.reply-box');
  el.querySelector('.reply-toggle').onclick = () => replyBox.classList.toggle('hidden');

  el.querySelector('.submit-reply').onclick = async () => {
    const content = el.querySelector('.reply-input').value.trim();
    if (!content) return;
    await supabase.from('community_replies').insert({
      post_id: post.id,
      author_id: session.user.id,
      author_name: session.user.email,
      content
    });
    load();
  };

  const repliesEl = el.querySelector('.replies');
  post.community_replies.forEach(r => {
    const d = document.createElement('div');
    d.className = 'text-sm';
    d.innerHTML = `<p class="font-medium">${r.author_name}</p><div class="prose prose-sm">${marked.parse(r.content)}</div>`;
    repliesEl.appendChild(d);
  });

  feed.appendChild(el);
}

submit.onclick = async () => {
  await supabase.from('community_posts').insert({
    author_id: session.user.id,
    author_name: session.user.email,
    title: document.getElementById('title').value,
    content: document.getElementById('content').value,
    is_question: document.getElementById('is-question').checked
  });
  document.getElementById('title').value = '';
  document.getElementById('content').value = '';
  load();
};
</script>
</body>
</html>
