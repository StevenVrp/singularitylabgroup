<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singularity Lab - Lessons</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'singularity-blue': '#2b7ce9',
                        'singularity-dark': '#000000',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; scroll-behavior: smooth; }
        .glass-nav { backdrop-filter: saturate(180%) blur(20px); background: rgba(255,255,255,0.75); }
        .hero-gradient { background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.35), transparent); }
        .fade-in { animation: fadeIn 0.45s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .timeline-line { position: absolute; left: 15px; top: 0; bottom: 0; width: 3px; border-radius: 999px; }
        .lesson-node { width: 32px; height: 32px; border-radius: 999px; border: 4px solid; background: white; transition: all .35s ease; }
        .lesson-node:hover { transform: scale(1.15); }
        .video-iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 2rem; }
        .resource-card { transition: all 0.35s ease; }
        .resource-card:hover { transform: translateY(-6px); box-shadow: 0 30px 60px rgba(0,0,0,0.12); }
        .icon-box { width: 80px; height: 80px; border-radius: 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 2.25rem; }
    </style>
</head>

<body class="bg-singularity-light-gray text-singularity-gray">

<!-- NAV -->
<nav class="glass-nav fixed top-0 left-0 w-full z-50 shadow-sm">
    <div class="container mx-auto px-6 flex items-center justify-between h-16">
        <img src="/Images/Logo2.png" class="h-10 cursor-pointer" onclick="showHome()">
        <div class="flex items-center gap-3">
            <button id="btn-standard" onclick="showCurriculum('standard')"
                class="px-6 py-2.5 rounded-full font-semibold text-sm bg-singularity-blue text-white shadow">
                Standard
            </button>
            <button id="btn-discovery" onclick="showCurriculum('discovery')"
                class="px-6 py-2.5 rounded-full font-semibold text-sm bg-gray-200 text-gray-700 hover:bg-gray-300 transition">
                Discovery
            </button>
        </div>
    </div>
</nav>

<!-- APP -->
<main id="app" class="pt-32"></main>

<!-- 页脚 -->
    <footer class="bg-black text-white py-12">
        <div class="container mx-auto px-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-12">
                <!-- Resources -->
                <div>
                    <h4 class="text-lg font-bold mb-4">Resources</h4>
                    <ul class="space-y-2">
                        <li><a href="/lessons/" class="text-gray-400 hover:text-white transition-colors">Singularity Lessons</a></li>
                        <li><a href="https://study.singularitylabgroup.org" class="text-gray-400 hover:text-white transition-colors">Study Assistant Pro</a></li>
                    </ul>
                </div>
                
                <!-- Community -->
                <div>
                    <h4 class="text-lg font-bold mb-4">Community</h4>
                    <ul class="space-y-2">
                        <li><a href="/?redirect=/home/#community" class="text-gray-400 hover:text-white transition-colors">FAQs</a></li>
                        <li><a href="/community/" class="text-gray-400 hover:text-white transition-colors">Discussion Forum</a></li>
                        <li><a href="/community/" class="text-gray-400 hover:text-white transition-colors">Articles</a></li>
                    </ul>
                </div>
                
                <!-- About -->
                <div>
                    <h4 class="text-lg font-bold mb-4">About</h4>
                    <ul class="space-y-2">
                        <li><a href="/?redirect=/home/#partners" class="text-gray-400 hover:text-white transition-colors">Partners</a></li>
                        <li><a href="/?redirect=/home/#about" class="text-gray-400 hover:text-white transition-colors">Our Mission</a></li>
                        <li><a href="/?redirect=/home/#members" class="text-gray-400 hover:text-white transition-colors">Meet the Team</a></li>
                        <li><a href="/?redirect=/home/#join" class="text-gray-400 hover:text-white transition-colors">Join Us</a></li>
                    </ul>
                </div>
                
                <!-- Follow Us -->
                <div>
                    <h4 class="text-lg font-bold mb-4">Follow Us</h4>
                    <div class="flex space-x-4 mb-6">
                        <a href="https://space.bilibili.com/1372845857" target="_blank" class="text-gray-400 hover:text-white transition-colors text-xl">
                            <i class="fab fa-bilibili"></i>
                        </a>
                        <a href="https://www.youtube.com/@SingularityLab123" target="_blank" class="text-gray-400 hover:text-white transition-colors text-xl">
                            <i class="fab fa-youtube-play"></i>
                        </a>
                        <a href="mailto:singularitylabgroup@outlook.com" class="text-gray-400 hover:text-white transition-colors text-xl">
                            <i class="fa fa-envelope"></i>
                        </a>
                    </div>
                    <h4 class="text-lg font-bold mb-4">Language</h4>
                    <a href="#" class="text-gray-400 hover:text-white transition-colors">English</a>
                </div>
            </div>
            
            <div class="border-t border-gray-800 pt-8 flex flex-col md:flex-row justify-between items-center">
                <p class="text-gray-500 text-sm mb-4 md:mb-0"><i class="fa-solid fa-closed-captioning text-[0.8rem] opacity-70 hover:opacity-100 transition-opacity"></i> 2026 Singularity Lab. All rights reserved.</p>
                <div class="flex space-x-6">
                    <a href="#privacy-policy" class="text-gray-500 hover:text-white text-sm transition-colors">Privacy Policy</a>
                    <a href="#terms-of-use" class="text-gray-500 hover:text-white text-sm transition-colors">Terms of Use</a>
                    <a href="#license" class="text-gray-500 hover:text-white text-sm transition-colors">License</a>
                </div>
            </div>
        </div>
    </footer>
</body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = window.supabase.createClient(
    'https://wtfmsmibjktgajegflwp.supabase.co',
    'sb_publishable_ez5qG1v0pPIuvv7FF4x7ew_YuqM7dDJ'
);

let currentMode = 'standard';

/* ---------- Auth ---------- */
document.addEventListener('DOMContentLoaded', async () => {
    const ONE_DAY = 24 * 60 * 60 * 1000;
    const loginTime = localStorage.getItem('login_time');
    if (!loginTime || Date.now() - Number(loginTime) > ONE_DAY) {
        await supabaseClient.auth.signOut();
        return location.href = '/login/';
    }
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return location.href = '/login/';
    showCurriculum('standard');
});

/* ---------- Helpers ---------- */
async function exists(url) {
    try { return (await fetch(url, { method: 'HEAD' })).ok; } catch { return false; }
}
async function detect(folder, exts) {
    for (const e of exts) {
        const p = `/lessons/files/${folder}/${folder}.${e}`;
        if (await exists(p)) return p;
    }
    return null;
}
async function bilibiliSrc(folder) {
    const r = await fetch(`/lessons/files/${folder}/description.txt`);
    if (!r.ok) return null;
    const t = await r.text();
    const m = t.match(/iframevideohere:[\s\S]*?<iframe[^>]*src="([^"]+)"/i);
    return m ? m[1] : null;
}

/* ---------- Views ---------- */
function showHome() {
    document.getElementById('app').innerHTML = `
        <div class="text-center py-32 fade-in">
            <p class="uppercase tracking-[0.35em] text-gray-400 mb-6">Singularity Lessons</p>
            <h1 class="text-6xl font-extrabold mb-6">Select a Curriculum</h1>
            <p class="text-xl text-gray-500 max-w-2xl mx-auto">
                Choose a learning path to begin exploring physics at depth.
            </p>
        </div>
    `;
}

async function showCurriculum(type) {
    currentMode = type;
    const accent = type === 'discovery' ? 'purple' : 'blue';

    document.getElementById('btn-standard').className =
        type === 'standard'
            ? 'px-6 py-2.5 rounded-full font-semibold text-sm bg-singularity-blue text-white shadow'
            : 'px-6 py-2.5 rounded-full font-semibold text-sm bg-gray-200 text-gray-700 hover:bg-gray-300 transition';

    document.getElementById('btn-discovery').className =
        type === 'discovery'
            ? 'px-6 py-2.5 rounded-full font-semibold text-sm bg-purple-600 text-white shadow'
            : 'px-6 py-2.5 rounded-full font-semibold text-sm bg-gray-200 text-gray-700 hover:bg-gray-300 transition';

    const res = await fetch(`/lessons/files/${type === 'standard' ? 'lessons.json' : 'discovery.json'}`);
    const lessons = await res.json();

    document.getElementById('app').innerHTML = `
        <section class="relative h-[420px] bg-black overflow-hidden">
            <img src="/Images/Background.jpg" class="absolute inset-0 w-full h-full object-cover opacity-45">
            <div class="hero-gradient absolute inset-0"></div>
            <div class="relative z-10 flex flex-col justify-end h-full px-10 md:px-20 pb-16 text-white">
                <p class="uppercase tracking-[0.35em] text-${accent}-200 text-sm mb-4">
                    ${type === 'discovery' ? 'Discovery Pathway' : 'Standard Curriculum'}
                </p>
                <h1 class="text-5xl md:text-7xl font-extrabold mb-6 leading-tight">Learning Modules</h1>
                <p class="text-xl text-${accent}-100 max-w-3xl leading-relaxed">
                    Structured pathways designed to build deep intuition and mastery.
                </p>
            </div>
        </section>

        <section class="px-10 md:px-20 py-20 bg-white">
            <div class="max-w-4xl mx-auto relative">
                <div class="timeline-line bg-${accent}-500"></div>

                ${lessons.map((folder, i) => `
                    <div onclick="loadLesson('${folder}', '${type}')"
                        class="relative flex items-start gap-8 mb-14 cursor-pointer group">
                        <div class="lesson-node border-${accent}-500 group-hover:bg-${accent}-500 shrink-0"></div>
                        <div class="bg-white rounded-[2rem] p-8 border border-gray-200 group-hover:shadow-xl transition w-full">
                            <div class="flex items-start justify-between">
                                <div>
                                    <h2 class="text-2xl font-extrabold mb-2 group-hover:text-${accent}-600 transition">
                                        ${folder.replaceAll('_', ' ')}
                                    </h2>
                                    <p class="text-gray-500 text-lg leading-relaxed">
                                        ${type === 'discovery' ? 'Exploratory module' : 'Core curriculum module'}
                                    </p>
                                </div>
                                <span class="text-${accent}-500 text-sm font-semibold ml-6 shrink-0">
                                    Module ${i + 1}
                                </span>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        </section>
    `;
}

async function loadLesson(folder, type) {
    const accent = type === 'discovery' ? 'purple' : 'blue';
    const [image, video, ppt, notes, bili] = await Promise.all([
        detect(folder, ['png','jpg','jpeg']),
        detect(folder, ['mp4','mov']),
        detect(folder, ['ppt','pptx']),
        detect(folder, ['doc','docx']),
        bilibiliSrc(folder)
    ]);

    let description = 'No description available.';
    try {
        const r = await fetch(`/lessons/files/${folder}/description.txt`);
        if (r.ok) {
            description = (await r.text()).split('iframevideohere:')[0].trim();
        }
    } catch {}

    document.getElementById('app').innerHTML = `
        <section class="relative h-[460px] bg-black overflow-hidden rounded-[2rem] mb-20 fade-in">
            <img src="/Images/Background.jpg" class="absolute inset-0 w-full h-full object-cover opacity-50">
            <div class="hero-gradient absolute inset-0"></div>
            <div class="relative z-10 flex flex-col justify-end h-full px-10 md:px-20 pb-16 text-white">
                <p class="uppercase tracking-[0.35em] text-${accent}-200 text-sm mb-4">
                    ${type === 'discovery' ? 'Discovery Module' : 'Standard Curriculum'}
                </p>
                <h1 class="text-5xl md:text-7xl font-extrabold mb-6 leading-tight">${folder.replaceAll('_', ' ')}</h1>
                <p class="text-xl text-${accent}-100 max-w-3xl leading-relaxed">${description}</p>
            </div>
        </section>

        ${(video || bili) ? `
        <section class="px-10 md:px-20 mb-20 fade-in">
            <div class="flex items-center gap-5 mb-8">
                <div class="icon-box bg-${accent}-100 text-${accent}-600">
                    <i class="fa-solid fa-play"></i>
                </div>
                <div>
                    <h2 class="text-4xl font-extrabold">Lesson Video</h2>
                    <p class="text-gray-500 text-lg">Full walkthrough and explanation.</p>
                </div>
            </div>
            <div class="overflow-hidden rounded-[2rem] shadow-2xl bg-black">
                ${video ? `<video controls class="w-full"><source src="${video}"></video>` :
                  `<iframe class="video-iframe" src="${bili}" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>`}
            </div>
        </section>` : ''}

        <section class="px-10 md:px-20 pb-20 fade-in">
            <h2 class="text-4xl font-extrabold mb-12">Learning Resources</h2>
            <div class="grid md:grid-cols-2 gap-10">
                ${ppt ? `
                <a href="${ppt}" download class="resource-card bg-white rounded-[2rem] p-10 border border-gray-200">
                    <div class="icon-box bg-orange-100 text-orange-500 mb-8">
                        <i class="fa-solid fa-file-powerpoint"></i>
                    </div>
                    <h3 class="text-3xl font-extrabold mb-4">Presentation Slides</h3>
                    <p class="text-gray-500 text-lg leading-relaxed mb-8">Classroom slides and diagrams.</p>
                    <span class="inline-flex items-center gap-3 font-semibold text-${accent}-600">
                        Download <i class="fa-solid fa-arrow-right"></i>
                    </span>
                </a>` : ''}
                ${notes ? `
                <a href="${notes}" download class="resource-card bg-white rounded-[2rem] p-10 border border-gray-200">
                    <div class="icon-box bg-green-100 text-green-500 mb-8">
                        <i class="fa-solid fa-file-lines"></i>
                    </div>
                    <h3 class="text-3xl font-extrabold mb-4">Guided Notes</h3>
                    <p class="text-gray-500 text-lg leading-relaxed mb-8">Printable notes and exercises.</p>
                    <span class="inline-flex items-center gap-3 font-semibold text-${accent}-600">
                        Download <i class="fa-solid fa-arrow-right"></i>
                    </span>
                </a>` : ''}
            </div>
        </section>
    `;
}

showHome();
</script>

</body>
</html>
