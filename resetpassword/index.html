<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset password · Singularity Lab</title>
    <link rel="icon" href="/Images/favicon.ico">
    <style>
        * {box-sizing:border-box}
        body {margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem; font:1rem/1.5 system-ui,sans-serif; color:#192338; background:#f3f5f9}
        main {width:min(100%,27rem); padding:clamp(1.5rem,5vw,2.5rem); border:1px solid #dbe1eb; border-radius:1.3rem; background:white; box-shadow:0 1rem 3rem #1522320d}
        img {height:2.25rem; max-width:100%; object-fit:contain}
        h1 {font-size:1.85rem; line-height:1.15; letter-spacing:-.04em}
        label {display:block; margin-top:.85rem; font-weight:600}
        input, button {width:100%; padding:.75rem 1rem; font:inherit; border:1px solid #adbac9; border-radius:.65rem}
        button {margin-top:1rem; border:0; color:white; background:#225dc0; font-weight:600; cursor:pointer}
        button:disabled {opacity:.65}
        a {color:#2259ac}
        footer {display:flex; flex-wrap:wrap; gap:1rem; margin-top:1.4rem}
        #reset-status {color:#455067}
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
    <script defer src="/login/auth-client.js"></script>
    <script defer src="/resetpassword/recovery.js"></script>
</head>
<body>
    <main>
        <a href="/home/"><img src="/Images/Logo2.png" alt="Singularity Lab home"></a>
        <h1>Reset your password</h1>
        <p id="reset-status" role="status">Checking your recovery link…</p>
        <noscript>Enable JavaScript to use your recovery link.</noscript>
        <form id="new-password-form" hidden>
            <label for="new-password">New password</label>
            <input id="new-password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" required autocomplete="new-password">
            <button id="save-password" type="submit">Save new password</button>
        </form>
        <footer><a id="retry-link" href="/login/#forgot-password" hidden>Request another link</a><a href="/login/">Back to sign in</a></footer>
    </main>
</body>
</html>
