<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Singularity Lab</title>
    <script>
      // Older links put the destination in the query and the section in the fragment.
      let destination = new URL("/home/", location.origin);
      const requested = new URLSearchParams(location.search).get("redirect");
      if (requested) {
        try {
          const candidate = new URL(requested, location.origin);
          if (
            candidate.origin === location.origin &&
            candidate.pathname !== "/" &&
            candidate.pathname !== "/index.html"
          )
            destination = candidate;
        } catch {
          /* Use the homepage for invalid destinations. */
        }
      }
      if (location.hash && !destination.hash) destination.hash = location.hash;
      location.replace(destination.href);
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=/home/" /></noscript>
  </head>
  <body>
    <a href="/home/">Open Singularity Lab</a>
  </body>
</html>
